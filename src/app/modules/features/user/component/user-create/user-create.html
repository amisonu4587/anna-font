<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2 mt-3">
      <div class="col-sm-6">
        <h1 class="d-inline">Create User</h1>

      </div>

      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item">
            <a href="">Home</a>
          </li>
          <li class="breadcrumb-item">
            <a href="">Users</a>
          </li>
          <li class="breadcrumb-item">
            <a href="">Create Users</a>
          </li>
        </ol>
      </div>
    </div>
  </div>
</section>

<section class="content">
  <div class="row m-2">
    <div class="col-12">
      <div class="card card-outline" style="border-top: 3px solid #022e5f">
        <form method="post" enctype="multipart/form-data" id="frmCreateUser" action="https://2210-esdhd.i2g11.com/user">

          <div class="card-body">
            <div class="row">
              <input type="hidden" name="id" id="id" value="0" placeholder="" required="" />
              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="selectUserType">User Type</label>
                  <select class="form-control form-control-sm text-sm rounded-0 text-capitalize" id="selectUserType"
                    name="selectUserType" required="">
                    <option value="" disabled="">Select User Type</option>
                      @for (role of allRoles(); track role.id; let i = $index) {
                        <option value="{{role.id}}">{{role.name}}</option>
                      }

                  </select>
                </div>
              </div>
              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="inputFName">Name</label>
                  <input type="text" class="form-control form-control-sm text-sm rounded-0" name="name"
                    id="name" value="" placeholder="Enter Name" required="" />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="cellPhone">CellPhone</label>
                  <input type="text" class="form-control form-control-sm text-sm rounded-0" name="cellPhone"
                    id="cellPhone" value="" placeholder="Enter cellPhone" required="" />
                </div>
              </div>
              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="workPhone">WorkPhone</label>
                  <input type="text" class="form-control form-control-sm text-sm rounded-0" name="workPhone"
                    id="workPhone" value="" placeholder="Enter workPhone" required="" />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="" class="form-control form-control-sm text-sm rounded-0 scripts"
                    name="email" id="email" value="" placeholder="Enter Email" />
                </div>
              </div>

              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control form-control-sm text-sm rounded-0" id="password"
                    name="password" placeholder="Password" value="" required="" autocomplete="new-password" />
                </div>
              </div>
            </div>
            <div class="row">
              

              <div class="col-md-4 col-sm-6 col-xs-12">
                <div class="form-group">
                  <label for="selectStatus">Is Active</label>
                  <select class="form-control form-control-sm text-sm rounded-0" name="selectStatus" id="selectStatus">
                    <option value="0">Inactive</option>
                    <option value="1" selected="">Active</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="card-footer mt-n4">
            <button type="submit" id="btnCreateUserSubmit" class="btn btn-info btn-flat text-white">
              Create
            </button>
            <a routerLink="/associate-data/users" class="btn btn-danger  btn-flat text-white"
              style="margin-left: 5px;">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
