<div class="login-container">
  <div class="login-box">
    <div class="card login-card">
      <!-- Logo -->
      <div class="card-header text-center">
        <img src="images/annabigl.png" alt="Anna" class="login-logo" />
      </div>

      <div class="card-body">
        <form>
          <!-- Email -->
          <div class="form-group">
            <div class="input-group rounded-pill shadow mb-3">
              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>

              <input type="email" class="form-control" placeholder="Enter your Email" formControlName="username" />

            </div>

          </div>




          <!-- Remember + Login -->
          <div class="row align-items-center">
            <div class="col-md-7 col-sm-12">
              <div class="remember-me">
                <input type="checkbox" id="remember" />
                <label for="remember"> I am Not a Robot </label>
              </div>
            </div>

            <div class="col-md-5 col-sm-12">
              <button class="btn btn-custom btn-block btn-sm" type="submit">
                    Forgot Password
              </button>
            </div>
          </div>
        </form>



        <!-- Home -->
        <div class="text-center link-row">
              <a routerLink="/application/online-application"> Go To Home Page </a>
          </div>
      </div>
    </div>
  </div>
</div>
