<div class="login-container">
  <div class="login-box">
    <div class="card login-card">
      <!-- Logo -->
      <div class="card-header text-center">
        <img src="images/annabigl.png" alt="Anna" class="login-logo" />
      </div>

      <div class="card-body">
        <form [formGroup]="login" (ngSubmit)="Login()">
          <!-- Email -->
          <div class="form-group">
            <div class="input-group rounded-pill shadow mb-3">
              <span class="input-group-text">
                <i class="fas fa-user"></i>
              </span>

              <input type="email" class="form-control" placeholder="Enter your Email" formControlName="username" />

            </div>
            @if (f['username'].hasError('required') && f['username'].touched) {
              <span class="errorMessage"> This Field Is Required </span>
            }
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="input-group rounded-pill shadow mb-3">
              <span class="input-group-text">
                <i class="fas fa-key"></i>
              </span>

              <input type="password" class="form-control" placeholder="Enter your Password"
                formControlName="password" />


              <span class="input-group-text password-icon">
                <i class="fas fa-eye"></i>
              </span>
            </div>
              @if (f.password.hasError('required') && f.password.touched) {
              <span class="errorMessage">
                This Field Is Required
              </span>
              }
          </div>

          <!-- Remember + Login -->
          <div class="row align-items-center">
            <div class="col-md-7 col-sm-12">
              <div class="remember-me">
                <input type="checkbox" id="remember" />

                <label for="remember"> Remember Me </label>
              </div>
            </div>

            <div class="col-md-5 col-sm-12">
              <button class="btn btn-custom btn-block btn-sm" type="submit" [disabled]="login.invalid">
                Login
              </button>
            </div>
          </div>
        </form>

        <!-- Forgot Password -->
        <div class="text-center link-row">
          <a href="javascript:void(0)"> Forgot Password? </a>
        </div>

        <!-- Home -->
        <!-- <div class="text-center link-row">
                    <a href="javascript:void(0)"> Go To Home Page </a>
                </div> -->
      </div>
    </div>
  </div>
</div>
