<div class="login-container">

  <div class="login-box">

    <!-- Logo -->
    <!-- Logo -->
    <div class="login-logo">
      <a routerLink="/login">
        <img src="images/engage1.png" alt="Anna" class="login-logo-img" />
      </a>
    </div>

    <!-- Login Card -->
    <div class="card login-card">

      <div class="card-body">

        <p class="login-message">
          Sign in to start your session
        </p>

        <form [formGroup]="login" (ngSubmit)="Login()">

          <!-- Email -->
          <div class="form-group">

            <div class="input-group">

              <input type="email" class="form-control" placeholder="Email" formControlName="username" />

              <div class="input-group-append">
                <span class="input-group-text">
                  <i class="fas fa-envelope"></i>
                </span>
              </div>

            </div>

            @if (f['username'].hasError('required') && f['username'].touched) {
            <span class="errorMessage">This Field Is Required</span>
            }

          </div>

          <!-- Password -->
          <div class="form-group">

            <div class="input-group">

              <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Password"
                formControlName="password" />

              <div class="input-group-append">
                <span class="input-group-text password-icon" (click)="showPassword = !showPassword">
                  <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </span>
              </div>

            </div>

            @if (f['password'].hasError('required') && f['password'].touched) {
            <span class="errorMessage">This Field Is Required</span>
            }

          </div>

          <!-- Remember Me + Login -->
          <div class="row align-items-center login-actions">

            <div class="col-7">
              <div class="remember-me">
                <input type="checkbox" id="remember" />
                <label for="remember">Remember Me</label>
              </div>
            </div>

            <div class="col-5">
              <button class="btn btn-custom btn-block" type="submit" [disabled]="login.invalid || loading()">

                @if (loading()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
                <!-- Logging in... -->
                } @else {
                Sign In
                }

              </button>
            </div>

          </div>

        </form>

        <!-- Footer Links -->
        <div class="login-footer">

          <a routerLink="/forgot-password">
            <i class="fas fa-key"></i>
            Forgot Password?
          </a>

          <a routerLink="/application/online-application">
            <i class="fas fa-home"></i>
            Go To Home Page
          </a>

        </div>

      </div>

    </div>

    <!-- Bottom Text -->
    <div class="login-caption">
      SOFTWARE. SOLUTIONS. SUCCESS.
    </div>

  </div>

</div>
