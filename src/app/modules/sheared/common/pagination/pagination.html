<div class="pagination-wrapper">

    <div class="pagination-info">
        Showing
        <strong> {{ startItem }} </strong>
        to
        <strong> {{ endItem }} </strong>
        of
        <strong> {{ totalItems }} </strong>
        entries
    </div>

    <nav class="pagination-nav" aria-label="Pagination">

        <button type="button" class="page-btn previous-btn" [disabled]="currentPage === 1" (click)="previous()">
            Previous
        </button>

        @for (page of pages; track $index) {

            @if (isPageNumber(page)) {
                <button type="button" class="page-btn" [class.active]="page === currentPage" (click)="goToPage(page)">
                    {{ page }}
                </button>
            } @else {
            <span class="page-dots"> ... </span>
            } 
        }

        <button type="button" class="page-btn next-btn" [disabled]="currentPage === totalPages" (click)="next()">
            Next
        </button>
    </nav>
</div>
